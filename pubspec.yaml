 name: med
 description: "Final year project"


 publish_to: 'none' 


 version: 1.0.0+1

 environment:
  sdk: ^3.9.2
#-----------packages--------#
 dependencies:
  flutter:
    sdk: flutter
#_________________Utility Packages_________________#
  http: ^1.1.0
  intl: ^0.20.2
  logger: ^2.0.1
  url_launcher: ^6.3.2
  flutter_native_splash: ^2.4.7
  smooth_page_indicator: ^2.0.1
  dots_indicator: ^2.1.0
  # carousel_slider_x: ^6.0.7
  

 # icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8
  #state management
  get: ^4.6.6
  get_storage: ^2.1.1
  #product specific
  carousel_slider: ^5.1.1
  readmore: ^3.0.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.1


 dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

 flutter:
 
  uses-material-design: true
  #___________________Local Assets___________________#
  assets:
    - assets/images/on_boarding_images/
    - assets/images/animations/
    - assets/logos/
    - assets/logos/final-image.png
    - assets/images/user/
    # - assets/icons/brands/
    - assets/icons/categories/
    # - assets/icons/payment_methods/
    - assets/images/banners/
    - assets/images/products/
  
  #___________________Local Fonts___________________#
  fonts:
  - family: Poppins
    fonts:
     - asset: assets\fonts\Poppins-Light.ttf
       weight: 300 
     - asset: assets\fonts\Poppins-Regular.ttf
       weight: 400
     - asset: assets\fonts\Poppins-Italic.ttf
       style: italic
     - asset: assets\fonts\Poppins-Medium.ttf
       weight: 500
     - asset: assets\fonts\Poppins-MediumItalic.ttf
       weight: 500
       style: italic
     - asset: assets\fonts\Poppins-SemiBold.ttf
       weight: 600
     - asset: assets\fonts\Poppins-Bold.ttf
       weight: 800        
  
    


  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
